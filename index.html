<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website Title -->
    <title>Karan Collection</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Karan Collection – Premium footwear collection with easy WhatsApp ordering."
    />
    <meta name="author" content="Karan Collection" />

    <!-- Open Graph (for WhatsApp / LinkedIn sharing) -->
    <meta property="og:title" content="Karan Collection" />
    <meta
      property="og:description"
      content="Browse premium footwear and order instantly via WhatsApp."
    />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Karan Collection" />
    <meta
      name="twitter:description"
      content="Browse premium footwear and order instantly via WhatsApp."
    />

    <!-- Optional favicon (add only if you upload favicon.png to /public folder) -->
    <!-- <link rel="icon" type="image/png" href="/favicon.png" /> -->
  </head>

  <body>
    <!-- React root -->
    <div id="root"></div>

    <!-- App entry file -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
